name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # The legacy modules are intentionally migrated incrementally.  Keep
      # the new extension layers gated from day one and expand this scope as
      # each legacy module is cleaned up.
      - run: >-
          python -m ruff check src/tg_botx/core
          src/tg_botx/features/channel.py src/tg_botx/features/commands.py
          src/tg_botx/features/monitoring.py src/tg_botx/integrations/telegram.py
      - run: >-
          python -m ruff format --check src/tg_botx/core
          src/tg_botx/features/channel.py src/tg_botx/features/commands.py
          src/tg_botx/features/monitoring.py src/tg_botx/integrations/telegram.py
      - run: >-
          python -m mypy src/tg_botx/core
          src/tg_botx/features/channel.py src/tg_botx/features/commands.py
          src/tg_botx/features/monitoring.py src/tg_botx/integrations/telegram.py
      - run: python -m compileall -q src
