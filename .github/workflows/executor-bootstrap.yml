name: Executor offline validation bootstrap

on:
  push:
    branches: [feat/secure-command-executors]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Package tracked source and public development dependencies
        run: |
          mkdir -p offline/wheels
          git archive --format=tar HEAD > offline/source.tar
          python -m pip wheel --wheel-dir offline/wheels '.[dev]'
      - uses: actions/upload-artifact@v4
        with:
          name: executor-offline-validation
          path: offline/
          retention-days: 1
