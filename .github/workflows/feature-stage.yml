name: Stage reviewed backend changes

on:
  pull_request:
    paths:
      - .github/workflows/feature-stage.yml

permissions:
  contents: write

concurrency:
  group: stage-reviewed-backend
  cancel-in-progress: false

jobs:
  stage:
    if: github.head_ref == 'feat/random-runs-message-library' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply reviewed changes and verify exact content
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          patch = pathlib.Path('feature-stage.patch').read_text().replace('\n diff --git ', '\ndiff --git ')
          target = pathlib.Path('/tmp/reviewed-feature.patch')
          target.write_text(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          expected = {
            'README.md': '1840054735619c33ce359a53f62a3f7df8231e5d989d072f3881c2e1ea176d36',
            'examples/random-messages.yaml': 'eca2329cea06d8e2d5e303167b91c43408d5df12c626003a1a0e87fc41686161',
            'src/tg_botx/features/message_library/models.py': '92a4b11989571b744b0fb67093ffef39364a3dc6d3dee1ca0140645f5a00cb3c',
            'src/tg_botx/features/checkin/executor.py': '31f563c56ab4315656cf71fbdefa53a0af458fbaaf0a209a20cf3773c522666a',
            'src/tg_botx/features/checkin/workflows.py': '7c59f886d75bbbb2de659706650cc308cb00fb0dc29e36d3091dcc407cd4abf8',
            'src/tg_botx/features/checkin/step_models.py': 'e4d25b316e75c700deda4fbc35b28d495b164f5f469953f27f43c22835ae1e2c',
            'src/tg_botx/features/checkin/schedule.py': '4d3b54f03af711fed489b1a399a6a72ff6f724de07781740edceb380d68c9a05',
            'src/tg_botx/features/checkin/validation.py': 'a8310a1d38cca1292a115826eb08b0a9c369336a1a4b102698ecf53091847707',
            'src/tg_botx/features/checkin/tasks.py': 'df9d83227f67ef6573fa778b80fbcb4cf86c262759d81beb508e601d52fda7c1',
            'src/tg_botx/features/checkin/coordinator.py': 'c7140a444eead5e38939e4400aa5531f8e6941ee2cd9dd83609f4959574dd12d',
            'src/tg_botx/features/checkin/steps/send_message.py': 'b95ac214883e4212bf88c736323b3109efcecc658191c6b6af5bbf48147f5115',
            'src/tg_botx/interfaces/admin/routes/tasks.py': '6000704729003f11323204ede1807849f7a122b94138fb793d1f04629dce6de9',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src
      - run: python -m ruff format --check src
      - run: python -m mypy src
      - run: python -m compileall -q src
      - name: Commit reviewed stages to this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'feat(workflow): 接入实时随机消息并完善保存发布及运行校验'
          git add README.md examples/random-messages.yaml
          git commit -m 'docs: 说明执行次数与消息库语义并增加完整示例'
          git push origin HEAD:refs/heads/feat/random-runs-message-library
