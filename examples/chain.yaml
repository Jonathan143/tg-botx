name: 每日链式签到
account: default
target: "@example_bot"

schedule:
  type: random
  timezone: Asia/Shanghai
  start: "09:00:00"
  end: "18:00:00"

steps:
  - type: send_message
    text: "/start"
  - type: wait_message
    success:
      mode: regex
      value: "请选择"
    timeout_seconds: 60
  - type: click_button
    text: "每日签到"
  - type: wait_message
    success:
      mode: regex
      value: "签到成功|已经签到"
    failure:
      mode: contains
      value: "签到失败"
    timeout_seconds: 60
