name: 每日直接签到
account: default
target: "@example_bot"

schedule:
  type: fixed
  timezone: Asia/Shanghai
  time: "10:40:00"

retry:
  max_attempts: 1
  backoff_seconds: [30, 60, 120]

notifications:
  failure: true
  success: true

output_bot_response: true

steps:
  - type: send_message
    text: "/checkin"
  - type: wait_message
    success:
      - mode: contains
        value: "签到成功"
      - mode: contains
        value: "已完成签到"
    failure:
      mode: contains
      value: "签到失败"
    timeout_seconds: 60
