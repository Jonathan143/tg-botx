[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-checkin-bot"
version = "0.1.5"
description = "Telegram user-account check-in scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "tg-bot contributors" }]
keywords = ["telegram", "telethon", "scheduler", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "APScheduler>=3.10,<4",
  "cryptography>=43.0",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "Telethon>=1.36",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "qrcode[pil]>=7.4",
  "typer>=0.12",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
tg-bot = "tg_botx.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_botx"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tg_botx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["tg_botx"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
files = ["src/tg_botx"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(tests|data)/"

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
